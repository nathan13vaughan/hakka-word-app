name: Daily Hakka word

on:
  schedule:
    - cron: "0 21 * * *" # 21:00 UTC = 7 a.m. Sydney (AEST)
  workflow_dispatch: {} # manual runs (e.g. from the GitHub mobile app) force an extra word

permissions:
  contents: write

concurrency:
  group: daily-word
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TZ: Australia/Sydney
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate word
        run: node generate.js ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/words.json data/latest.json
          git diff --cached --quiet || git commit -m "Daily word"
          git push
